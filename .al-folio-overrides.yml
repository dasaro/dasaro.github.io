# Tracks site-local overrides of plugin-owned (gem) runtime files.
# See docs/BOUNDARIES.md ("Local site overrides are still valid ...").
# Regenerate / verify with:  bundle exec al-folio upgrade overrides audit
#
# On a `bundle update` that bumps al_folio_core, the upstream SHA below will no
# longer match the gem's file: re-sync this override from upstream and re-apply
# the local changes, then refresh local_sha256.
overrides:
  - path: _layouts/default.liquid
    owner: al_folio_core
    version: 1.0.11
    upstream_sha256: 4b713c35f7383692b99f4f1086123acbc3cb247e775a4cebe39985b5302fb9b2
    local_sha256: 5a89fb847ec3051abaf88fb83499d727e1b1f06c1fb2933bb8e8007e23de4c8c
    reason: >
      Adds two lines. {% include site_styles.liquid %} at the end of <head> loads
      site-local CSS fixes (currently: dropdown menus in the collapsed mobile navbar,
      which the theme leaves positioned off-screen). {% include math_bg.liquid %}
      before {% include scripts.liquid %} injects the site-local mathematical
      backgrounds (assets/js/math-bg.js).
